name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the web app into www
        run: |
          mkdir -p www
          for f in index.html styles.css app.js pdf.js sw.js manifest.json books.json africa.svg emblem.svg logo.png icon-192.png icon-512.png; do
            [ -e "$f" ] && cp "$f" www/
          done
          if [ -d books ]; then
            mkdir -p www/books
            cp -r books/. www/books/
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the library logo as the app icon
        run: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#faf4dd' --iconBackgroundColorDark '#faf4dd'

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          IN="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            A="$KEY_ALIAS"; SP="$KEYSTORE_PASSWORD"; KP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No signing secrets set: using a one-off key. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS to the repo secrets so updates install over older versions."
            SP=changeit1; KP=changeit1; A=app
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" -keypass "$KP" -alias "$A" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App, O=Maxido Entertainment"
          fi
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$A" --ks-pass "pass:$SP" --key-pass "pass:$KP" --out "African-History.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "African-History.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: kenya-history-android-apk
          path: African-History.apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" African-History.apk \
            --title "African History app (Android) v${{ github.run_number }}" \
            --notes "Install: download African-History.apk on your phone, open it and allow installing from this source. Uninstall any older copy first. Books and covers update by themselves when the phone has internet."
