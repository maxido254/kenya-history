<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>African History</title>
  <meta name="theme-color" content="#006600">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" class="splash" role="presentation">
    <img src="logo.png" alt="">
    <p>African History</p>
  </div>
  <header class="masthead">
    <div class="masthead-inner">
      <img id="logo" class="logo" src="logo.png" alt="" onerror="this.onerror=null;this.src='emblem.svg'">
      <div>
        <p class="kicker">Maktaba ya Historia ya Afrika</p>
        <h1>African History</h1>
      </div>
    </div>
  </header>

  <div id="install" class="install" hidden>
    <img src="icon-192.png" alt="">
    <div class="install-text">
      <strong>Install African History</strong>
      <span id="installHint">Keep it on your home screen and read offline.</span>
    </div>
    <button id="installBtn" type="button">Install</button>
    <button id="installClose" type="button" aria-label="Close">&times;</button>
  </div>

  <section class="tools">
    <input id="search" type="search" placeholder="Search by title, author or subject" aria-label="Search the library">
    <div id="filters" class="filters" role="group" aria-label="Subjects"></div>
  </section>

  <main>
    <p id="status" role="status"></p>
    <div id="covers" class="covers"></div>
  </main>

  <footer>
    <p>Every text here is shared with the permission of its rights holder. Rights holders who want a title taken down can contact the site owner.</p>
  </footer>

  <div id="reader" class="reader" hidden>
    <div class="bar">
      <button id="back" type="button">&larr; Library</button>
      <span id="rtitle" class="title"></span>
      <button id="chaptersBtn" type="button">Chapters</button>
      <button id="smaller" type="button" aria-label="Smaller text">A&minus;</button>
      <button id="larger" type="button" aria-label="Larger text">A+</button>
      <button id="theme" type="button">Night</button>
      <button id="pdf" type="button">Download PDF</button>
    </div>
    <div id="scroll"><article id="page" class="page"></article></div>
    <div id="drawer" class="drawer" hidden>
      <div class="drawer-panel">
        <h3>Chapters</h3>
        <ol id="chapterList"></ol>
        <p id="rights" class="rights"></p>
      </div>
    </div>
  </div>

  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
